plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.netflix.dgs.codegen' version '5.6.9'
}

group = 'com.keto'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation platform("com.netflix.graphql.dgs:graphql-dgs-platform-dependencies:10.0.0")
	implementation "com.netflix.graphql.dgs:graphql-dgs-spring-graphql-starter"
	implementation 'com.netflix.graphql.dgs:graphql-dgs-extended-scalars'
	implementation 'net.datafaker:datafaker:1.7.0'
	implementation 'org.apache.commons:commons-lang3:3.17.0'
	implementation 'org.ocpsoft.prettytime:prettytime:5.0.6.Final'
	implementation("org.bouncycastle:bcprov-jdk15on:1.70")


	runtimeOnly 'org.postgresql:postgresql'


}

tasks.named('test') {
	useJUnitPlatform()
}

generateJava {
	packageName = 'com.keto.generated'
	generateClient=true
	typeMapping=["Date"				:"java.time.LocalDate",
				 "NonNegativeInt"	:"java.lang.Integer",
				 "Url"				:"java.net.URL"]
}